<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhiskerWatch V3 — Koilada Community Cat Welfare</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS for Interactive Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .leaflet-container { height: 100%; width: 100%; border-radius: 0.75rem; background: #1e293b; z-index: 1; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden select-none">

    <!-- SETUP & DISPLAY NAME MODAL -->
    <div id="setup-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-emerald-500/10 text-emerald-400 mb-3 text-2xl">
                    <i class="fa-solid fa-cat"></i>
                </div>
                <h2 class="text-xl font-bold">Welcome to WhiskerWatch V3</h2>
                <p class="text-sm text-slate-400 mt-1">Koilada Stray Cat Census & Welfare Management</p>
            </div>
            <p class="text-xs text-slate-300 mb-4 bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                <i class="fa-solid fa-circle-info text-sky-400 mr-1"></i> <strong>Shared Dataset Notice:</strong> Contributors share a unified local-first dataset. Please enter your display name for action attribution.
            </p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Your Display Name *</label>
                    <input type="text" id="setup-display-name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-100" placeholder="e.g., Maria K.">
                </div>
                <button id="btn-complete-setup" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-lg">
                    Start Contributing
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- TOP HEADER BAR -->
        <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-paw"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm sm:text-base leading-tight tracking-tight">WhiskerWatch <span class="text-xs font-normal text-emerald-400 ml-1">Koilada V3</span></h1>
                    <p class="text-[10px] text-slate-400 hidden sm:block">Community Cat Welfare & Population Management</p>
                </div>
            </div>

            <!-- Sync Status & Quick Actions -->
            <div class="flex items-center space-x-2">
                <div id="sync-badge" class="hidden sm:flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-[11px]">
                    <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span id="sync-text" class="text-slate-300">Saved Locally</span>
                </div>
                
                <!-- PHOTO-FIRST ADD CAT BUTTON -->
                <button id="btn-photo-first" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center space-x-1.5 shadow-sm transition-colors">
                    <i class="fa-solid fa-camera"></i>
                    <span class="hidden md:inline">Add Cat — Photo</span>
                </button>
                
                <button id="btn-settings" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-sm transition-colors" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main id="main-content" class="flex-1 overflow-y-auto relative bg-slate-950">
            <!-- Dynamic Screens Render Here -->
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="bg-slate-900 border-t border-slate-800 grid grid-cols-4 py-2 px-3 shrink-0 text-center z-20">
            <button data-screen="home" id="nav-home" class="nav-btn flex flex-col items-center justify-center text-emerald-400">
                <i class="fa-solid fa-map text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Home Map</span>
            </button>
            <button data-screen="colonies" id="nav-colonies" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-layer-group text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Colonies</span>
            </button>
            <button data-screen="grid" id="nav-grid" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-grid-2 text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Cat Grid</span>
            </button>
            <button data-screen="insights" id="nav-insights" class="nav-btn flex flex-col items-center justify-center text-slate-400 hover:text-slate-200">
                <i class="fa-solid fa-chart-pie text-base mb-0.5"></i>
                <span class="text-[10px] font-medium">Insights</span>
            </button>
        </nav>
    </div>

    <!-- HIDDEN PHOTO INPUT -->
    <input type="file" id="global-photo-input" accept="image/*" capture="environment" class="hidden">

    <!-- APPLICATION CONTROLLER SCRIPT -->
    <script>
        class WhiskerWatchApp {
            constructor() {
                try {
                    this.state = {
                        currentScreen: 'home',
                        selectedColonyId: null,
                        selectedCatId: null,
                        displayName: localStorage.getItem('ww_display_name') || '',
                        colonies: JSON.parse(localStorage.getItem('ww_colonies') || '[]'),
                        cats: JSON.parse(localStorage.getItem('ww_cats') || '[]'),
                        resightings: JSON.parse(localStorage.getItem('ww_resightings') || '[]'),
                        alerts: JSON.parse(localStorage.getItem('ww_alerts') || '[]'),
                        careEpisodes: JSON.parse(localStorage.getItem('ww_care') || '[]'),
                        history: JSON.parse(localStorage.getItem('ww_history') || '[]'),
                        settings: JSON.parse(localStorage.getItem('ww_settings') || '{"radius":50}')
                    };
                } catch (e) {
                    localStorage.clear();
                    this.state = {
                        currentScreen: 'home', selectedColonyId: null, selectedCatId: null,
                        displayName: '', colonies: [], cats: [], resightings: [], alerts: [], careEpisodes: [], history: [], settings: { radius: 50 }
                    };
                }
                
                this.koiladaCoords = [37.4134, 23.1256];
                this.mapInstance = null;
                this.currentTileLayer = null;
                this.mapLayerType = 'street';
                this.activePhotoFirstFile = null;
                this.isAddingColonyMode = false;
            }

            init() {
                this.bindGlobalListeners();
                if (!this.state.displayName) {
                    const setupModal = document.getElementById('setup-modal');
                    if (setupModal) setupModal.classList.remove('hidden');
                } else {
                    this.render();
                }
            }

            bindGlobalListeners() {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const screen = btn.getAttribute('data-screen');
                        if (screen) this.navigateTo(screen);
                    });
                });

                document.getElementById('btn-photo-first')?.addEventListener('click', () => this.triggerPhotoFirstAddCat());
                document.getElementById('btn-settings')?.addEventListener('click', () => this.openSettings());
                document.getElementById('btn-complete-setup')?.addEventListener('click', () => this.completeSetup());

                document.getElementById('global-photo-input')?.addEventListener('change', (e) => this.handleGlobalPhotoSelected(e));
            }

            completeSetup() {
                const nameInput = document.getElementById('setup-display-name');
                if (!nameInput) return;
                const nameVal = nameInput.value.trim();
                if (!nameVal) {
                    alert('Please enter a display name to continue.');
                    return;
                }
                this.state.displayName = nameVal;
                localStorage.setItem('ww_display_name', nameVal);
                document.getElementById('setup-modal')?.classList.add('hidden');
                this.logHistory('Setup', 'System', 'Initialized local user: ' + nameVal);
                this.render();
            }

            saveLocal() {
                try {
                    localStorage.setItem('ww_colonies', JSON.stringify(this.state.colonies));
                    localStorage.setItem('ww_cats', JSON.stringify(this.state.cats));
                    localStorage.setItem('ww_resightings', JSON.stringify(this.state.resightings));
                    localStorage.setItem('ww_alerts', JSON.stringify(this.state.alerts));
                    localStorage.setItem('ww_care', JSON.stringify(this.state.careEpisodes));
                    localStorage.setItem('ww_history', JSON.stringify(this.state.history));
                    localStorage.setItem('ww_settings', JSON.stringify(this.state.settings));
                } catch (e) {
                    console.error('Storage save error:', e);
                }
            }

            logHistory(actionType, recordId, details) {
                const entry = {
                    id: 'hist_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9),
                    actor: this.state.displayName || 'Anonymous',
                    timestamp: new Date().toISOString(),
                    actionType, recordId, details
                };
                this.state.history.unshift(entry);
                this.saveLocal();
            }

            navigateTo(screen, colonyId = null, catId = null) {
                this.state.currentScreen = screen;
                if (colonyId !== null) this.state.selectedColonyId = colonyId;
                if (catId !== null) this.state.selectedCatId = catId;
                this.isAddingColonyMode = false;
                
                document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.replace('text-emerald-400', 'text-slate-400'));
                const activeNav = document.getElementById('nav-' + (screen === 'profile' || screen === 'colony-profile' ? (screen === 'profile' ? 'grid' : 'colonies') : screen));
                if (activeNav) activeNav.classList.replace('text-slate-400', 'text-emerald-400');

                this.render();
            }

            render() {
                const container = document.getElementById('main-content');
                if (!container) return;
                container.innerHTML = '';

                switch (this.state.currentScreen) {
                    case 'home':
                        container.innerHTML = this.renderHomeScreen();
                        this.initHomeMap();
                        this.bindHomeEvents();
                        break;
                    case 'colonies':
                        container.innerHTML = this.renderColoniesScreen();
                        this.bindColoniesEvents();
                        break;
                    case 'grid':
                        container.innerHTML = this.renderCatGridScreen();
                        this.bindGridEvents();
                        break;
                    case 'profile':
                        container.innerHTML = this.renderCatProfileScreen();
                        this.initCatMap();
                        this.bindProfileEvents();
                        break;
                    case 'colony-profile':
                        container.innerHTML = this.renderColonyProfileScreen();
                        this.bindColonyProfileEvents();
                        break;
                    case 'insights':
                        container.innerHTML = this.renderInsightsScreen();
                        break;
                    case 'settings':
                        container.innerHTML = this.renderSettingsScreen();
                        this.bindSettingsEvents();
                        break;
                }
            }

            renderHomeScreen() {
                const addModeClass = this.isAddingColonyMode ? 'bg-rose-600 hover:bg-rose-500' : 'bg-emerald-600 hover:bg-emerald-500';
                const addModeIcon = this.isAddingColonyMode ? 'fa-xmark' : 'fa-plus';
                const addModeText = this.isAddingColonyMode ? 'Cancel Add' : 'Add Colony';

                return `
                    <div class="h-full flex flex-col p-3 space-y-2">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 shrink-0 bg-slate-900 p-3 rounded-xl border border-slate-800">
                            <div>
                                <h2 class="text-sm font-bold text-slate-200">Koilada Colony Map</h2>
                                <p class="text-[11px] text-slate-400">
                                    ${this.isAddingColonyMode ? '<strong class="text-emerald-400 animate-pulse">👉 Tap anywhere on the map to place new colony!</strong>' : 'Interactive census map centred on Koilada, Peloponnese.'}
                                </p>
                            </div>
                            <div class="flex flex-wrap items-center gap-1.5 w-full sm:w-auto">
                                <button id="map-btn-add-colony" class="${addModeClass} text-white text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">
                                    <i class="fa-solid ${addModeIcon} mr-1"></i> ${addModeText}
                                </button>
                                <button id="map-btn-layer" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg font-medium">
                                    <i class="fa-solid fa-layer-group text-sky-400 mr-1"></i> ${this.mapLayerType === 'street' ? 'Satellite' : 'Street'}
                                </button>
                                <button id="map-btn-koilada" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg font-medium">
                                    <i class="fa-solid fa-crosshairs text-emerald-400 mr-1"></i> Koilada
                                </button>
                                <button id="map-btn-gps" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg font-medium" title="My GPS Location">
                                    <i class="fa-solid fa-location-arrow text-sky-400"></i>
                                </button>
                                <button id="map-btn-export" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-2.5 py-1.5 rounded-lg font-medium" title="Export Data">
                                    <i class="fa-solid fa-download text-sky-400"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex-1 relative min-h-[350px] rounded-xl overflow-hidden border border-slate-800 shadow-inner">
                            <div id="map" class="absolute inset-0"></div>
                        </div>
                    </div>
                `;
            }

            bindHomeEvents() {
                document.getElementById('map-btn-add-colony')?.addEventListener('click', () => {
                    this.isAddingColonyMode = !this.isAddingColonyMode;
                    this.render();
                });
                document.getElementById('map-btn-layer')?.addEventListener('click', () => this.toggleMapLayer());
                document.getElementById('map-btn-koilada')?.addEventListener('click', () => this.centreOnKoilada());
                document.getElementById('map-btn-gps')?.addEventListener('click', () => this.panToMyGPS());
                document.getElementById('map-btn-export')?.addEventListener('click', () => this.exportDataset());
            }

            initHomeMap() {
                setTimeout(() => {
                    const mapEl = document.getElementById('map');
                    if (!mapEl) return;

                    if (this.mapInstance) {
                        this.mapInstance.remove();
                    }

                    this.mapInstance = L.map('map').setView(this.koiladaCoords, 15);
                    this.setMapTileLayer();

                    this.mapInstance.on('click', (e) => {
                        if (this.isAddingColonyMode) {
                            this.confirmAndCreateColonyAt(e.latlng.lat, e.latlng.lng);
                        }
                    });

                    this.state.colonies.forEach(colony => {
                        if (!colony.lat || !colony.lng) return;
                        
                        const cats = this.state.cats.filter(c => c.colonyId === colony.id && !c.archived);
                        const sterilised = cats.filter(c => c.sterilisation === 'Sterilised').length;
                        const sterPct = cats.length ? Math.round((sterilised / cats.length) * 100) : 0;
                        const urgentAlerts = this.state.alerts.filter(a => cats.some(c => c.id === a.catId) && a.status !== 'Resolved').length;

                        let markerColor = '#059669';
                        if (urgentAlerts > 0) markerColor = '#e11d48';
                        else if (cats.some(c => c.bodyCondition === 'Emaciated' || c.health === 'Unwell') || sterPct < 50) markerColor = '#d97706';

                        const markerHtml = `<div class="w-9 h-9 rounded-full border-2 border-white shadow-lg flex items-center justify-center text-white font-bold text-xs" style="background-color: ${markerColor};"><i class="fa-solid fa-paw"></i></div>`;
                        const customIcon = L.divIcon({ html: markerHtml, className: '', iconSize: [36, 36], iconAnchor: [18, 18] });

                        const marker = L.marker([colony.lat, colony.lng], { icon: customIcon }).addTo(this.mapInstance);
                        
                        const popupDiv = document.createElement('div');
                        popupDiv.className = "p-3 text-slate-900 max-w-xs space-y-2";
                        popupDiv.innerHTML = `
                            <div class="flex items-center justify-between">
                                <h3 class="font-bold text-base text-slate-900">${colony.name}</h3>
                                <span class="bg-slate-100 text-slate-800 px-2 py-0.5 rounded text-[10px] font-bold">${cats.length} cats</span>
                            </div>
                            <p class="text-xs text-slate-600">${colony.notes || 'No location notes.'}</p>
                            <div class="grid grid-cols-2 gap-1 text-[11px] bg-slate-100 p-2 rounded">
                                <div>Sterilised: <strong>${sterPct}%</strong></div>
                                <div>Urgent Alerts: <strong class="text-rose-600">${urgentAlerts}</strong></div>
                            </div>
                            <div class="grid grid-cols-2 gap-1.5 pt-1">
                                <button class="btn-col-profile bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1.5 rounded text-xs font-semibold text-center">Colony Profile</button>
                                <button class="btn-col-grid bg-slate-800 hover:bg-slate-900 text-white px-2.5 py-1.5 rounded text-xs font-semibold text-center">Cat Grid</button>
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-slate-200 text-[11px]">
                                <button class="btn-col-move text-sky-700 hover:underline"><i class="fa-solid fa-arrows-to-dot mr-1"></i>Move Marker</button>
                                <button class="btn-col-del text-rose-600 hover:underline"><i class="fa-solid fa-trash mr-1"></i>Delete</button>
                            </div>
                        `;

                        popupDiv.querySelector('.btn-col-profile').addEventListener('click', () => this.navigateTo('colony-profile', colony.id));
                        popupDiv.querySelector('.btn-col-grid').addEventListener('click', () => this.navigateTo('grid', colony.id));
                        popupDiv.querySelector('.btn-col-move').addEventListener('click', () => this.moveColony(colony.id));
                        popupDiv.querySelector
