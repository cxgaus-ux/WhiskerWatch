function openColony(id){

    const colonies =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    const colony =
        colonies.find(
            c => c.id === id
        );

    document
        .getElementById("colonyDetail")
        .innerHTML = `
            <h2>${colony.name}</h2>

            <p>${colony.notes || ""}</p>

            <p>
              Radius:
              ${colony.radius || 50}m
            </p>

            <p>
              Cats: 0
            </p>
        `;
}
