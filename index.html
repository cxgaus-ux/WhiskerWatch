<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WhiskerWatch</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
}

header{
    background:#2f6246;
    color:white;
    padding:15px;
}

h1{
    margin:0;
}

#colonyDetail{
    padding:15px;
    margin:15px;
    border:1px solid #ccc;
    border-radius:8px;
    background:white;
}

.cat-card{
    padding:10px;
    margin-top:8px;
    border:1px solid #ddd;
    border-radius:6px;
}

#controls{
    padding:10px;
    background:#f2f2f2;
}

button{
    padding:10px;
    margin-right:10px;
    cursor:pointer;
}

#map{
    height:80vh;
}

#colonySection{
    padding:15px;
}

.colony-card{
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
    background:white;
}

.colony-card h3{
    margin-top:0;
    margin-bottom:5px;
}

.colony-card button{
    margin-top:5px;
}

</style>

</head>

<body>

<header>
<h1>WhiskerWatch</h1>
<div>
Community Cat Welfare Management System
</div>
</header>

<div id="controls">

<button id="addColonyBtn">
Add Colony
</button>

<button id="exportBtn">
Export Data
</button>

<button id="importBtn">
Import Data
</button>

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none;"
>

<button id="clearBtn">
Clear Test Data
</button>

</div>

<div id="map"></div>

<div id="colonySection">

    <h2>Colonies</h2>

    <div id="colonyList"></div>

</div>

<div id="colonyDetail"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const STORAGE_KEY = "whiskerwatch_colonies";

const CAT_STORAGE_KEY = "whiskerwatch_cats";

let addingColony = false;

const map = L.map("map").setView(
    [37.4115,23.1357],
    15
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:"© OpenStreetMap"
    }
).addTo(map);

function loadColonies(){

    const data =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    data.forEach(colony=>{
        addMarker(colony);
    });

}

function saveColony(colony){

    const data =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    data.push(colony);

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}

function addMarker(colony){

    const marker = L.marker([
        colony.lat,
        colony.lng
    ]).addTo(map);

     L.circle(
        [colony.lat, colony.lng],
        {
            radius: colony.radius || 50,
            color: "#2f6246",
            fillColor: "#2f6246",
            fillOpacity: 0.1
        }
    ).addTo(map);
    
    marker.bindPopup(`
        <b>${colony.name}</b>
        <br>
        ${colony.notes || ""}
        <br>
        Radius: ${colony.radius || 50}m
    `);
}

document
.getElementById("addColonyBtn")
.addEventListener("click",()=>{

    addingColony = true;

    alert(
      "Click on the map to place the colony."
    );

});

document
.getElementById("exportBtn")
.addEventListener(
    "click",
    exportData
);

map.on("click", e=>{

    if(!addingColony){
        return;
    }

    const name = prompt(
        "Colony name?"
    );

    if(!name){
        return;
    }

    const notes = prompt(
        "Location notes?"
    ) || "";


    const colony = {

    id:Date.now(),

    name:name,

    notes:notes,

    radius:50,

    lat:e.latlng.lat,

    lng:e.latlng.lng

};

    saveColony(colony);

    addMarker(colony);

renderColonyList();

addingColony = false;

});

document
.getElementById("importBtn")
.addEventListener("click",()=>{

    document
        .getElementById("importFile")
        .click();

});

document
.getElementById("importFile")
.addEventListener(
    "change",
    importData
);

document
.getElementById("clearBtn")
.addEventListener("click",()=>{

    if(
      confirm(
        "Delete all local test data?"
      )
    ){

        localStorage.removeItem(
            STORAGE_KEY
        );

        location.reload();

    }

});

function renderColonyList(){

    const colonyList =
        document.getElementById("colonyList");

    colonyList.innerHTML = "";

    const data =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    data.forEach(colony=>{

        const card =
            document.createElement("div");

        card.className =
            "colony-card";

       card.innerHTML = `
    <h3>${colony.name}</h3>

    <p>${colony.notes || ""}</p>

    <p>
      Radius:
      ${colony.radius || 50}m
    </p>

  <button onclick="openColony(${colony.id})">
    Open
</button>

<button onclick="editColony(${colony.id})">
    Edit
</button>

<button onclick="deleteColony(${colony.id})">
    Delete Colony
</button>
`;

        colonyList.appendChild(card);

    });

}

function exportData(){

    const data =
        localStorage.getItem(STORAGE_KEY);

    const blob =
        new Blob(
            [data || "[]"],
            {
                type:
                "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "whiskerwatch-backup-2026-10-28.json";

    link.click();

    URL.revokeObjectURL(url);

}

function importData(event){

    const file =
        event.target.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e){

        try{

            const importedData =
                JSON.parse(
                    e.target.result
                );

            if(
                !confirm(
                    "Replace current colonies with imported data?"
                )
            ){
                return;
            }

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(importedData)
            );

            location.reload();

        }
        catch(error){

            alert(
                "Invalid backup file."
            );

        }

    };

    reader.readAsText(file);

}

function editColony(id){

    const colonies =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    const colony =
        colonies.find(
            c => c.id === id
        );

    if(!colony){
        return;
    }

    const newName =
        prompt(
            "Colony name:",
            colony.name
        );

    if(!newName){
        return;
    }

    const newNotes =
        prompt(
            "Location notes:",
            colony.notes
        ) || "";

    colony.name = newName;
    colony.notes = newNotes;

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(colonies)
    );

    location.reload();

}

function deleteColony(id){

    if(
        !confirm(
            "Delete this colony?"
        )
    ){
        return;
    }

    const colonies =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    const updatedColonies =
        colonies.filter(
            colony => colony.id !== id
        );

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(updatedColonies)
    );

    location.reload();

}

function openColony(colonyId){

    const colonies =
        JSON.parse(
            localStorage.getItem(STORAGE_KEY)
            || "[]"
        );

    const cats =
        JSON.parse(
            localStorage.getItem(CAT_STORAGE_KEY)
            || "[]"
        );

    const colony =
        colonies.find(
            c => c.id === colonyId
        );

    const colonyCats =
        cats.filter(
            c => c.colonyId === colonyId
        );

    document
    .getElementById("colonyDetail")
    .innerHTML = `
        <h2>${colony.name}</h2>

        <p>${colony.notes || ""}</p>

        <p>
            Cats:
            ${colonyCats.length}
        </p>

        <button
            onclick="addCat(${colonyId})">
            Add Cat
        </button>

        <div>
            ${colonyCats.map(cat => `
                <div class="cat-card">

    <strong>
        ${cat.name}
    </strong>

    <br>

    ${cat.description || ""}

    <br>

    Sex:
    ${cat.sex}

    <br>

    Life Stage:
    ${cat.lifeStage}

    <br>

    Sterilised:
    ${cat.sterilisation}

</div>
            `).join("")}
        </div>
    `;
}

function addCat(colonyId){

    const name =
        prompt(
            "Cat name?"
        );

    if(!name){
        return;
    }

   const description =
    prompt(
        "Description?"
    ) || "";

const notes =
    prompt(
        "Notes?"
    ) || "";

const sex =
    prompt(
        "Sex (male/female/unknown)?"
    ) || "unknown";

const lifeStage =
    prompt(
        "Life stage (kitten/juvenile/adult/senior)?"
    ) || "unknown";

const sterilisation =
    prompt(
        "Sterilisation (sterilised/unsterilised/unknown)?"
    ) || "unknown";

    const cats =
        JSON.parse(
            localStorage.getItem(
                CAT_STORAGE_KEY
            )
            || "[]"
        );

  cats.push({

    id: Date.now(),

    colonyId: colonyId,

    name: name,

    description: description,

    notes: notes,

    sex: sex,

    lifeStage: lifeStage,

    sterilisation: sterilisation

});

    localStorage.setItem(
        CAT_STORAGE_KEY,
        JSON.stringify(cats)
    );

    openColony(colonyId);

}

loadColonies();
renderColonyList();

</script>

</body>
</html>
